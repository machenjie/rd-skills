id: user-gate-evidence
phase: P6 user-requested verification gate
required_contracts:
  - path: src/professional-skills/quality-test-gate/SKILL.md
    must_contain:
      - "User-requested verification gate"
      - "AC: <criterion> - PROVEN BY <command/result/artifact>"
      - "Weak verify wording alone does not create a user-requested gate"
  - path: src/foundation/capabilities/test-strategy/SKILL.md
    must_contain:
      - "User-requested verification gate"
user_gate_cases:
  - name: strong-one-then-all-gate
    input: "先在一个样本上证明成功，再推广到所有样本，不要跳过这个 gate。"
    expected_status: user_requested_gate
    expected_scope: "one first, then all"
    evidence_required_contains:
      - "PROVEN BY"
  - name: bare-verify-is-normal-validation
    input: "实现后 verify 一下。"
    expected_status: normal_validation
