id: task-review-loop
phase: P5 implementer reviewer loop
required_contracts:
  - path: src/professional-skills/phase-review-capsule/SKILL.md
    must_contain:
      - "Task Implementation Review"
      - "Spec Compliance"
      - "Code Quality"
  - path: src/professional-skills/ai-code-review-refactor/SKILL.md
    must_contain:
      - "Task Implementation Review"
      - "Critical and Important findings must be repaired"
      - "Repair requires targeted re-review"
  - path: src/foundation/capabilities/code-review/SKILL.md
    must_contain:
      - "Task Implementation Review"
review_cases:
  - name: rejects-looks-good
    input: "Reviewed, looks good."
    expected_status: fail
    expected_missing:
      - spec_compliance
      - code_quality
      - reviewed_scope
      - required_next_action
      - residual_risk
