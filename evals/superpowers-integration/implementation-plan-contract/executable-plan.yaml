id: implementation-plan-contract-executable-plan
phase: P2/P3 executable visible Markdown plan
required_contracts:
  - path: src/professional-skills/task-dag-planner/SKILL.md
    must_contain:
      - "Visible Markdown Plan Contract"
      - "Every full-plan task must be agent-executable"
      - "No plan placeholders"
  - path: src/professional-skills/task-dag-planner/references/task-contract-patterns.md
    must_contain:
      - "Visible Markdown Plan Shape"
      - "Placeholder Replacement Rules"
      - "Do not require ordinary agents to emit JSON metadata"
visible_plan_cases:
  - name: valid-executable-plan
    input: |
      # Implementation Plan

      ## Task 1: Add route classification contract

      Goal:
      Create a route classification contract that maps engineering requests to the correct owner skill.

      Files:
      - Inspect: `src/registry/routing-rules.yaml`
      - Modify: `src/registry/routing-rules.yaml`
      - Test: `tests/scripts/test_eval_routing.py`

      Acceptance Criteria:
      - A non-trivial implementation request routes to the correct primary owner.

      Verify:
      - Command: `python3 scripts/eval-routing.py`

      Expected:
      - Routing eval passes with selected owner and skipped-owner rationale.

      Review:
      - Check spec compliance, code quality, routing precision, and over-trigger risk.

      Stop Conditions:
      - Stop if owner selection depends on an unresolved public contract or security decision.
    expected_status: pass
routing_cases:
  - case_id: superpowers-complex-engineering-flow
    candidate_output: evals/routing-outputs/superpowers-complex-engineering-flow.actual.yaml
