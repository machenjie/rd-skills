---
id: superpowers-complex-engineering-flow
description: |
  A rough, non-trivial engineering request needs requirement clarification,
  design/process traceability, a reviewable implementation plan, explicit user
  proof evidence, and task review/re-review ownership without loading broad
  product builders by default.
prompt: |
  I have a rough idea for a non-trivial engineering change. Current behavior,
  desired behavior, and acceptance signal are missing, and ownership/design/test
  mapping is unclear. Before implementation, create a reviewable implementation
  plan for multiple files with dependencies and sequencing, including PDD/DDD/SDD/TDD
  traceability. The user requested verification gate is: prove one sample first,
  then prove all samples before proceeding. The AI-generated implementation will
  need task review, repair/re-review if issues are found, and plan-vs-diff
  consistency before final handoff.
expected:
  complexity: L3
  risk_level: medium
  expected_stage: implementation-planning
  expected_context_budget_mode: staged-plan
  risk_triggers:
    - user requested verification gate
  skills:
    - change-intake-compiler
    - development-process-orchestrator
    - task-dag-planner
    - quality-test-gate
    - ai-code-review-refactor
  capabilities:
    - requirement-clarification
    - requirement-structuring
    - acceptance-standard-definition
    - implementation-structure-design
    - agent-execution-discipline
    - plan-execution-consistency
    - test-strategy
    - regression-testing
    - code-review
  domain_extensions: []
  quality_gates:
    - requirement gate
    - SDD gate
    - implementation gate
    - test gate
    - AI review gate
forbidden:
  skills:
    - frontend-change-builder
    - backend-change-builder
    - data-api-contract-changer
    - data-middleware-change-builder
    - integration-change-builder
    - delivery-release-gate
  capabilities:
    - data-migration-design
    - cache-design
    - release-rollback
  domain_extensions:
    - payment-trading-extension
    - web3-product-extension
    - ai-product-extension
  quality_gates:
    - delivery gate
notes: |
  This case proves the Superpowers-style route is explicit and minimal:
  clarify, confirm design/process traceability, plan, verify the user-requested
  proof gate, review task implementation, and re-review repairs without selecting
  unrelated product-surface builders.
