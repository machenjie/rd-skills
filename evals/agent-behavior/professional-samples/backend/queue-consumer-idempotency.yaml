id: queue-consumer-idempotency
description: Reliability review requires durable idempotency, replay, and observability evidence.
prompt: |
  Review a fulfillment queue consumer with no idempotency key, DLQ handling,
  replay command, or consumer lag metric.
expected:
  profile: review-agent
  primary_skill: reliability-observability-gate
  layer3_skills: [idempotency-retry-design, message-queue-design, observability]
  review_skill: reliability-observability-gate
  required_professional_obligations:
    - idempotency key and durable write boundary
    - duplicate delivery regression test
    - DLQ and replay path inspected
  forbidden_behaviors:
    - assume queue delivery is once only
    - acknowledge before durable write
actual:
  profile: review-agent
  primary_skill: reliability-observability-gate
  layer3_skills: [idempotency-retry-design, message-queue-design, observability]
  review_skill: reliability-observability-gate
  handoff:
    result: fail pending repair
    changed_files: []
    commands_run: [consumer and replay-path inspection]
    validation_results: duplicate delivery regression test not yet run
    findings: idempotency key and durable write boundary; duplicate delivery regression test; DLQ and replay path inspected
    unverified_scope: broker ordering simulation
    residual_risk: broker ordering not simulated
    recommended_next_step: add durable deduplication and replay test, then re-review
review:
  human_review_required: true
  promotion_status: candidate
  notes: Candidate captured fixture; not promoted evidence.
