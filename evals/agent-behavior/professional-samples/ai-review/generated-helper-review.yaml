id: generated-helper-review
description: Review checks reuse, placement, API reality, and proof limits without speculative skills.
prompt: |
  Review generated code that adds a shared tenant invoice helper under
  common/utils and calls a library method that may not exist.
expected:
  profile: review-agent
  primary_skill: ai-code-review-refactor
  layer3_skills: [implementation-structure-design, code-review, refactoring]
  review_skill: ai-code-review-refactor
  required_professional_obligations:
    - reuse search for existing helper
    - placement rationale for helper ownership
    - hallucinated API check
  forbidden_behaviors:
    - approve an invented shared helper
    - move a business rule into common utils
actual:
  profile: review-agent
  primary_skill: ai-code-review-refactor
  layer3_skills: [implementation-structure-design, code-review, refactoring]
  review_skill: ai-code-review-refactor
  handoff:
    result: fail pending owner placement
    changed_files: [common/utils helper, invoice caller]
    commands_run: [reuse search, type API search]
    validation_results: typecheck not run
    findings: reuse search for existing helper; placement rationale for helper ownership; hallucinated API check
    unverified_scope: typecheck and performance
    residual_risk: library API and indirect callers remain unverified
    recommended_next_step: place the rule with the invoice owner, verify API, run typecheck, and re-review
review:
  human_review_required: true
  promotion_status: candidate
  notes: Candidate captured fixture; not promoted evidence.
