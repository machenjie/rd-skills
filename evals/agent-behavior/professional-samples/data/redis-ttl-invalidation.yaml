id: redis-ttl-invalidation
description: A bounded cache repair uses one implementation Skill and one later review Skill.
prompt: |
  Fix an entitlement cache that stores user access in Redis forever, stays
  stale after account changes, and keys entries only by user id.
expected:
  profile: task-agent
  primary_skill: data-middleware-change-builder
  layer3_skills: [cache-design, observability, regression-testing]
  review_skill: reliability-observability-gate
  required_professional_obligations:
    - TTL and invalidation policy inspected
    - tenant-scoped cache key boundary
    - stale entitlement regression test
  forbidden_behaviors:
    - leave the cache without TTL
    - use a global cache key
actual:
  profile: task-agent
  primary_skill: data-middleware-change-builder
  layer3_skills: [cache-design, observability, regression-testing]
  review_skill: reliability-observability-gate
  handoff:
    result: repair implemented and targeted test passed
    changed_files: [entitlement cache, invalidation handler, regression test]
    commands_run: [targeted entitlement cache test]
    validation_results: stale entitlement regression test passed
    findings: TTL and invalidation policy inspected; tenant-scoped cache key boundary; stale entitlement regression test
    unverified_scope: production hot-key distribution
    residual_risk: production hot-key distribution not measured
    recommended_next_step: independent reliability review of the actual diff
review:
  human_review_required: true
  promotion_status: candidate
  notes: Candidate captured fixture; not promoted evidence.
