id: migration-rollback-review
description: Release review keeps expand-contract, compatibility, and rollback proof together.
prompt: |
  Review a release plan that drops a customer column and updates the API in one
  deploy, with no rollback command or old-pod compatibility check.
expected:
  profile: review-agent
  primary_skill: delivery-release-gate
  layer3_skills: [data-migration-design, release-rollback, version-compatibility]
  review_skill: delivery-release-gate
  required_professional_obligations:
    - expand-contract rollout phase
    - forward and rollback migration evidence
    - old and new pod compatibility boundary
  forbidden_behaviors:
    - drop the column in the same release
    - claim staging passed without output
actual:
  profile: review-agent
  primary_skill: delivery-release-gate
  layer3_skills: [data-migration-design, release-rollback, version-compatibility]
  review_skill: delivery-release-gate
  handoff:
    result: release blocked
    changed_files: []
    commands_run: [migration plan inspection]
    validation_results: forward and rollback migration evidence missing
    findings: expand-contract rollout phase; forward and rollback migration evidence; old and new pod compatibility boundary
    unverified_scope: production lock duration
    residual_risk: production lock duration not measured
    recommended_next_step: split expand and contract releases, add rollback drill, then re-review
review:
  human_review_required: true
  promotion_status: candidate
  notes: Candidate captured fixture; not promoted evidence.
