readability_review_attestation:
  schema_version: 5
  panel_kind: readability
  scope: ai-readability-and-density
  decision_method: three-independent-experts-majority
  limitations:
    - The canonical fixed Readability attestation is the sole evidence authority; its validated review ID, target and finding counts, and dispositions are derived dynamically from that artifact and the current application rather than fixed in this selector-free configuration.
    - Reviewer declarations are static. They do not prove identity, qualifications, or experience.
    - Static panel evidence does not prove real-host Profile startup, wall-clock performance, provider behavior, production accuracy, or installed user experience.
    - Canonical byte proxies do not prove actual token use, reviewer effort, or latency.
    - The canonical fixed attestation is checked directly against the current Readability target-authority manifest, detector contracts, and review contract; Git history carries replacement audit.
professional_completeness_review_attestation:
  schema_version: 5
  panel_kind: professional-completeness
  scope: professional-skill-packages
  decision_method: exact-package-carry-forward-qualified-reviewer-pool-domain-critical-fail-closed
  limitations:
    - A canonical compact attestation is current only when strict target-local validation accepts all 189 non-Control Skill packages with zero professional corrections or unresolved professional disagreements.
    - Reviewer declarations are static. They do not prove identity, qualifications, or experience.
    - Static panel evidence does not prove real-host Profile startup, wall-clock performance, provider behavior, production accuracy, or installed user experience.
    - Canonical byte proxies do not prove actual token use, reviewer effort, or latency.
    - The canonical fixed attestation must be current to all package, binding, dependency, review-contract, reviewer-partition, and authenticated vote authorities; Git history carries replacement audit.
