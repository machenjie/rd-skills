name: CI

on:
  pull_request: {}

permissions:
  contents: read

jobs:
  pr-ci:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies from isolated source
        run: |
          install_root="$(mktemp -d)"
          git archive --format=tar HEAD | tar -xf - -C "$install_root"
          python3 -m pip install --disable-pip-version-check "$install_root"

      - name: Run affected producer gate
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/eval-core-principles.py --gate affected --base "$CI_BASE_SHA" --head "$CI_HEAD_SHA"

      - name: Run affected tests
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/run-ci-tests.py run

      - name: Verify tracked checkout is unchanged
        run: git diff --exit-code --no-ext-diff --no-textconv HEAD --
