name: Formal Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  professional-contract-portability:
    name: Professional contract portability (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify portable Professional and detector contracts
        run: >-
          python3 -m unittest
          tests.scripts.test_professional_completeness_carry_forward.ProfessionalReviewContractFingerprintTests.test_review_contract_uses_canonical_semantic_projection
          tests.scripts.test_professional_completeness_carry_forward.ProfessionalReviewContractFingerprintTests.test_contract_version_and_semantic_projection_change_digest
          tests.scripts.test_audit_skill_content.AuditSkillContentDeterminismTests.test_root_detector_contract_binds_only_reachable_behavior
          tests.scripts.test_audit_skill_content.AuditSkillContentDeterminismTests.test_reachable_detector_source_walker_fails_closed
          tests.scripts.test_audit_skill_content.AuditSkillContentDeterminismTests.test_detector_fingerprint_is_independent_of_module_load_name
          tests.scripts.test_audit_skill_content.AuditSkillContentDeterminismTests.test_reference_detector_contract_v1_is_reachable_and_schema7
          tests.scripts.test_audit_skill_content.AuditSkillContentDeterminismTests.test_skill_detector_contract_is_deterministic_and_covers_report_fields
          tests.scripts.test_audit_skill_content.AuditSkillContentDeterminismTests.test_skill_detector_fingerprint_binds_repository_source
          tests.scripts.test_audit_skill_content.AuditSkillContentDeterminismTests.test_skill_detector_uses_versioned_explicit_source_manifest
          tests.scripts.test_validate_reference_content.ValidateReferenceContentTests.test_semantic_v7_detector_contract_is_closed_and_current
          tests.scripts.test_expert_panel_review.ExpertPanelReviewTests.test_semantic_detector_v1_compatibility_is_one_exact_row

  validate-release:
    needs: professional-contract-portability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies from isolated source
        run: |
          install_root="$(mktemp -d)"
          git archive --format=tar HEAD | tar -xf - -C "$install_root"
          python3 -m pip install --disable-pip-version-check "$install_root"

      - name: Core Principles formal release outcome gate
        run: python3 scripts/eval-core-principles.py --gate formal-release

      - name: Bind Expert Panel release manifest to this commit
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          FORMAL_REPORTS=".rd-skills/formal-release/${RELEASE_COMMIT}/reports/"
          PROFESSIONALISM_REPORT=".rd-skills/formal-release/${RELEASE_COMMIT}/reports/professionalism-regression-report.json"
          export FORMAL_REPORTS PROFESSIONALISM_REPORT
          python3 -c 'import json, os, sys; from pathlib import Path;
          sys.path.insert(0, "scripts");
          from validation_utils import validate_expert_panel_release_manifest;
          reports = Path(os.environ["FORMAL_REPORTS"]);
          expected = {"professionalism-regression-report.json", "professionalism-regression-report.md", "core-principles-outcomes.json", "core-principles-outcomes.md"};
          actual = {path.name for path in reports.iterdir() if path.is_file()};
          assert actual == expected, f"formal evidence files differ: {sorted(actual)}";
          professionalism = json.loads(Path(os.environ["PROFESSIONALISM_REPORT"]).read_text(encoding="utf-8"));
          core = json.loads((reports / "core-principles-outcomes.json").read_text(encoding="utf-8"));
          manifest = professionalism["expert_panel_release_manifest"];
          errors = validate_expert_panel_release_manifest(manifest, require_current=True, expected_head_commit=os.environ["RELEASE_COMMIT"]);
          assert not errors, "; ".join(errors);
          assert core.get("schema_version") == 4 and core.get("formal_evidence_head_commit") == os.environ["RELEASE_COMMIT"], "Core formal evidence is not bound to the release commit"'

      - name: Upload head-scoped formal evidence
        uses: actions/upload-artifact@v4
        with:
          name: rd-skills-formal-release-${{ github.sha }}
          path: .rd-skills/formal-release/${{ github.sha }}/reports/
          include-hidden-files: true
          if-no-files-found: error

      - name: Documentation and productization release checks
        run: |
          python3 scripts/validate-examples.py
          python3 scripts/generate-examples-showcase.py --out docs/SHOWCASE.md --check
          python3 scripts/generate-marketplace-catalog.py --profile recommended --out docs/MARKETPLACE_CATALOG.md --check
          python3 scripts/validate-marketplace-index.py --profile recommended
          python3 scripts/validate-marketplace-index.py --profile full
          python3 scripts/validate-marketplace-index.py --profile dev
          python3 scripts/validate-productization-assets.py
          python3 scripts/validate-open-source-readiness.py --require-pass

      - name: Unit tests and code-generation release checks
        run: |
          python3 scripts/run-ci-tests.py full --jobs 4 --timeout 900
          python3 scripts/validate-codegen-benchmarks.py
          python3 scripts/run-codegen-benchmarks.py --limit 3

      - name: Quickstart dry runs
        run: |
          python3 scripts/quickstart.py --agent codex --scope user --dry-run
          python3 scripts/quickstart.py --agent claude --scope project --target /tmp/changeforge-quickstart-claude --dry-run
          python3 scripts/quickstart.py --agent copilot --scope project --target /tmp/changeforge-quickstart-copilot --dry-run
          python3 scripts/quickstart.py --agent openai-api --dry-run

      - name: Generated artifact freshness
        run: git diff --exit-code
