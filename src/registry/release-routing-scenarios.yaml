schema_version: 2
kind: changeforge.release_routing_scenarios
scenarios:
  - id: bugfix
    router: {"trigger": "bounded local backend bug fix", "expected": {"profile": "task-agent", "primary": "backend-change-builder", "layer3": [], "review": "ai-code-review-refactor"}}
    codegen_case_id: "devex/bugfix-same-pattern-scan"
    codegen_layer3: []
  - id: module-feature
    router: {"trigger": "bounded backend feature with local owner discovery", "expected": {"profile": "task-agent", "primary": "backend-change-builder", "layer3": [], "review": "architecture-impact-reviewer"}}
    codegen_case_id: "structure/object-method-encapsulation-placement"
    codegen_layer3: ["domain-object-identification", "implementation-structure-design"]
  - id: parallel
    router: {"trigger": "integration implementation with established dependencies", "expected": {"profile": "task-agent", "primary": "integration-change-builder", "layer3": ["contract-testing"], "review": "ai-code-review-refactor"}}
    codegen_case_id: "devex/monorepo-affected-tests"
    codegen_layer3: ["contract-testing"]
  - id: diagnosis
    router: {"trigger": "failure diagnosis (`diagnosis-only`)", "expected": {"profile": "analysis-agent", "primary": "engineering-change-analysis", "layer3": ["failure-diagnosis"], "review": "reliability-observability-gate"}}
    codegen_case_id: "devex/test-failure-no-env-blame"
    codegen_layer3: ["failure-diagnosis"]
  - id: review
    router: {"trigger": "general diff review", "expected": {"profile": "review-agent", "primary": "ai-code-review-refactor", "layer3": [], "review": "ai-code-review-refactor"}}
    codegen_case_id: "structure/complexity-delete-list-review"
    codegen_layer3: ["minimal-correct-implementation"]
  - id: repair
    router: {"trigger": "bounded local backend repair", "expected": {"profile": "task-agent", "primary": "backend-change-builder", "layer3": [], "review": "ai-code-review-refactor"}}
    codegen_case_id: "review/repair-rereview-required"
    codegen_layer3: []
  - id: api-contract
    router: {"trigger": "public API or data-contract implementation", "expected": {"profile": "task-agent", "primary": "data-api-contract-changer", "layer3": ["api-contract-design", "dto-schema-design", "version-compatibility"], "review": "architecture-impact-reviewer"}}
    codegen_case_id: "data-api/backward-compatible-api-field"
    codegen_layer3: ["api-contract-design", "dto-schema-design", "version-compatibility"]
  - id: migration
    router: {"trigger": "stateful database cache queue or migration implementation", "expected": {"profile": "task-agent", "primary": "data-middleware-change-builder", "layer3": ["data-migration-design", "transaction-consistency", "release-rollback"], "review": "delivery-release-gate"}}
    codegen_case_id: "data-api/large-table-online-migration"
    codegen_layer3: ["data-migration-design", "transaction-consistency", "release-rollback"]
  - id: security-ssrf-boundary
    router: {"trigger": "SSRF or URL-fetch security implementation", "expected": {"profile": "task-agent", "primary": "security-privacy-gate", "layer3": ["threat-modeling", "web-security"], "review": "security-privacy-gate"}}
    codegen_case_id: "security/ssrf-url-allowlist"
    codegen_layer3: ["threat-modeling", "web-security"]
  - id: cache-stampede-reliability
    router: {"trigger": "cache stampede or cache-contention implementation", "expected": {"profile": "task-agent", "primary": "reliability-observability-gate", "layer3": ["concurrency-control", "degradation-circuit-breaking", "observability"], "review": "reliability-observability-gate"}}
    codegen_case_id: "reliability/redis-cache-stampede-protection"
    codegen_layer3: ["concurrency-control", "degradation-circuit-breaking", "observability"]
  - id: release
    router: {"trigger": "release implementation", "expected": {"profile": "task-agent", "primary": "delivery-release-gate", "layer3": ["release-rollback", "ci-cd", "version-compatibility"], "review": "delivery-release-gate"}}
    codegen_case_id: "delivery/rollback-migration-compatibility"
    codegen_layer3: ["release-rollback", "ci-cd", "version-compatibility"]
