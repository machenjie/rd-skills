---
schema_version: 3
kind: changeforge.control_skills
description: One dispatch-only control skill for bounded engineering coordination.
control_skills:
  - name: engineering-control-plane
    path: src/control-skills/engineering-control-plane
    role_support: [main-control-agent]
    trigger_signals:
      - engineering question, analysis, diagnosis, implementation, repair, review, validation, or release request
      - work benefits from bounded role separation or independent review
    anti_trigger_signals:
      - task already belongs to one dispatched analysis, task, or review agent
      - request requires the current agent to implement or review directly
    required_inputs:
      - user request
      - known scope and constraints
      - current workspace isolation capability when parallel writes are considered
      - current exact change evidence read and export, reviewer-accessible change reference, non-mutating validation, and workspace state observation capability facts
    output_contract:
      - implementation-first assignment with analysis or review only when useful
      - bounded profile and Skill assignments
      - progress, validation, review, repair, and closure summary
    escalation_signals:
      - user-visible behavior or scope choice
      - destructive, production, privileged, or irreversible operation
      - evidence gap that makes safe continuation impossible
    reference_index:
      - path: "references/professional-skill-router.md"
        type: targeted
        load_when: "select one Professional Skill"
        do_not_load_when: "capsule already fixes route"
        required_by: ["main-control-agent"]
        required_output: ["routing-decision"]
      - path: "references/direct-task-template.md"
        type: template
        load_when: "delegation needs explicit task context"
        do_not_load_when: "ordinary single-agent work already has sufficient context"
        required_by: ["main-control-agent"]
        required_output: ["task-contract"]
      - path: "references/engineering-brief-template.md"
        type: template
        load_when: "complex cross-agent decisions need stable communication"
        do_not_load_when: "a direct answer or ordinary implementation is sufficient"
        required_by: ["analysis-agent"]
        required_output: ["engineering-brief"]
      - path: "references/task-dag-template.md"
        type: template
        load_when: "Task DAG plans dependencies"
        do_not_load_when: "bounded task skips DAG"
        required_by: ["analysis-agent"]
        required_output: ["task-dag"]
      - path: "references/implementation-handoff-template.md"
        type: template
        load_when: "a downstream consumer needs implementation results"
        do_not_load_when: "ordinary result reporting is sufficient"
        required_by: ["task-agent"]
        required_output: ["implementation-handoff"]
      - path: "references/utility-capsule-template.md"
        type: template
        load_when: "utility needs no-edit capsule"
        do_not_load_when: "no utility operation exists"
        required_by: ["task-agent"]
        required_output: ["utility-handoff"]
      - path: "references/review-handoff-template.md"
        type: template
        load_when: "review requires independent handoff"
        do_not_load_when: "no review task exists"
        required_by: ["review-agent"]
        required_output: ["review-handoff"]
