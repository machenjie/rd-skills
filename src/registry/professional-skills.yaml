---
schema_version: 5
kind: changeforge.professional_skills
description: "AI-oriented primary engineering skills selected once per task."
automatic_routing_policy:
  implementation_owner:
    accepted:
      path: direct
      profile: task-agent
      layer3:
        source: task-evidence
        default: []
        max: 3
      review:
        source: selected-one-T2C-risk-or-default
        default: ai-code-review-refactor
    conflict:
      path: analyzed
      profile: analysis-agent
      primary_skill: engineering-change-analysis
      layer3_skills: [repository-context-map]
      review_skill: architecture-impact-reviewer
      reason: implementation-owner-conflict
professional_skills:
  - name: routing-quality-review
    routing_mode: not-automatic
    required_expertise_tags: ["foundation-engineering-workflow", "foundation-repository-intelligence"]
    path: "src/professional-skills/routing-quality-review"
    role_support: ["review-agent"]
    trigger_signals: ["rd-skills routing registry or router change", "route fixture owner conflict", "independently assigned post-authoring review of a changed rd-skills routing asset"]
    anti_trigger_signals: ["ordinary product engineering task", "global re-routing from inside a dispatched task agent", "no changed rd-skills routing asset or route-owner conflict to review"]
    required_inputs: ["four Skill registries", "compact routing index", "changed routing fixtures"]
    output_contract: ["routing findings", "trigger and anti-trigger conflicts", "coverage gaps", "validation results"]
    escalation_signals: ["scope, authority, or material risk exceeds the selected task contract"]
    reference_index:
      - path: "references/routing-maintenance-checklist.md"
        type: decision-checklist
        load_when: "routing review detects owner, trigger, or fixture conflicts"
        do_not_load_when: "routing registry and fixtures are unchanged or already agree"
        required_by: ["review-agent"]
        required_output: ["checklist-result", "residual-risk"]
    layer3_candidates: []
    task_routable: false
  - name: change-intake-compiler
    routing_mode: evidence-only
    required_expertise_tags: ["foundation-intake-requirements"]
    path: "src/professional-skills/change-intake-compiler"
    role_support: ["analysis-agent"]
    trigger_signals: ["ambiguous request", "missing desired behavior"]
    anti_trigger_signals: ["accepted Engineering Brief already exists", "no-repo direct-answer mode"]
    required_inputs: ["request summary", "observed current behavior"]
    output_contract: ["minimal intent slice with current behavior, desired behavior, observable acceptance or completion signal, constraints, non-goals, and affected surfaces", "assumptions", "open questions"]
    escalation_signals: ["scope, authority, or material risk exceeds the selected task contract"]
    reference_index:
      - path: "references/change-request-template.md"
        type: template
        load_when: "Drafting or normalizing the durable Change Request artifact"
        do_not_load_when: "Only readiness classification or gap triage is needed"
        required_by: ["analysis-agent"]
        required_output: ["completed-contract"]
      - path: "references/checklist.md"
        type: decision-checklist
        load_when: "Auditing intake readiness quickly before routing downstream"
        do_not_load_when: "The request is blocked by a single missing authority or evidence fact"
        required_by: ["analysis-agent"]
        required_output: ["checklist-result", "residual-risk"]
      - path: "references/evidence-patterns.md"
        type: evidence-pattern
        load_when: "Closure depends on raw-input-to-field mapping, stakeholder authority, source freshness, blocking-question evidence, or proof limits"
        do_not_load_when: "No evidence conflict, authority, or freshness issue is material"
        required_by: ["analysis-agent"]
        required_output: ["evidence-record", "proof-limit", "residual-risk"]
      - path: "references/index.md"
        type: index
        load_when: "competing change intake compiler references require dependency, conflict, or output-fragment selection"
        do_not_load_when: "the change intake compiler root or a task-named reference already resolves selection"
        required_by: ["analysis-agent"]
        required_output: ["reference-selection"]
    layer3_candidates: ["requirement-clarification", "requirement-structuring", "non-goal-boundary-definition", "user-role-identification"]
    task_routable: true
  - name: engineering-change-analysis
    routing_mode: evidence-only
    required_expertise_tags: ["foundation-architecture-design", "foundation-domain-modeling", "foundation-engineering-workflow", "foundation-intake-requirements", "foundation-quality-testing", "foundation-repository-intelligence"]
    path: "src/professional-skills/engineering-change-analysis"
    role_support: ["analysis-agent"]
    trigger_signals: ["implementation-preparation for source-backed desired-behavior, affected-consumer, and verification analysis before implementation or repair", "diagnosis-only for verified cause analysis", "source-backed-answer for a repository-dependent engineering question"]
    anti_trigger_signals: ["eligible bounded Direct Task", "source-free question", "accepted Engineering Brief already exists and the user explicitly requests one narrow artifact analysis", "module-boundary placement decision", "dependency-direction placement decision"]
    required_inputs: ["explicit mode: implementation-preparation, diagnosis-only, or source-backed-answer", "user request or question", "bounded repository read scope and known constraints", "current source and test evidence discovered within the assigned scope"]
    output_contract: ["implementation-preparation result defined by references/implementation-preparation.md with one initial Analysis or protected-decision Delta Analysis", "diagnosis-only result defined by references/diagnosis-only.md", "source-backed-answer result defined by references/source-backed-answer.md", "source-backed affected-consumer evidence and unresolved structural-risk handoff to `architecture-impact-reviewer`"]
    escalation_signals: ["scope, authority, or material risk exceeds the selected task contract"]
    reference_index:
      - path: "references/checklist.md"
        type: decision-checklist
        load_when: "A bounded review needs a concrete surface inventory across product, UX, domain, API, data, frontend, backend, integrations, security, tests, release, observability, and docs"
        do_not_load_when: "Evidence freshness, consumer proof, or performance blast radius is the core risk"
        required_by: ["analysis-agent"]
        required_output: ["checklist-result", "residual-risk"]
      - path: "references/diagnosis-only.md"
        type: mode-contract
        load_when: "engineering change analysis selects diagnosis-only"
        do_not_load_when: "engineering change analysis is executing another mode"
        required_by: ["analysis-agent"]
        required_output: ["mode-result", "proof-limit"]
      - path: "references/evidence-patterns.md"
        type: evidence-pattern
        load_when: "Closure depends on changed-surface-to-validation mapping, same-pattern scan proof, consumer evidence, rollback limits, graph/report freshness, or proof limits"
        do_not_load_when: "Only high-level routing is needed and evidence is not being closed"
        required_by: ["analysis-agent"]
        required_output: ["evidence-record", "proof-limit", "residual-risk"]
      - path: "references/implementation-preparation.md"
        type: mode-contract
        load_when: "engineering change analysis selects implementation-preparation"
        do_not_load_when: "engineering change analysis is executing another mode"
        required_by: ["analysis-agent"]
        required_output: ["mode-result", "proof-limit"]
      - path: "references/index.md"
        type: index
        load_when: "competing engineering change analysis references require dependency, conflict, or output-fragment selection"
        do_not_load_when: "the engineering change analysis root or a task-named reference already resolves selection"
        required_by: ["analysis-agent"]
        required_output: ["reference-selection"]
      - path: "references/solution-optimality.md"
        type: targeted
        load_when: "Performance/resource blast radius may include CPU, memory, network, disk, lock contention, throughput, or latency"
        do_not_load_when: "No performance-sensitive path or resource tradeoff is material"
        required_by: ["analysis-agent"]
        required_output: ["selected-approach", "residual-risk"]
      - path: "references/source-backed-answer.md"
        type: mode-contract
        load_when: "engineering change analysis selects source-backed-answer"
        do_not_load_when: "engineering change analysis is executing another mode"
        required_by: ["analysis-agent"]
        required_output: ["mode-result", "proof-limit"]
    context_admissibility:
      contract: "changeforge.reference-context-admissibility/v3"
      references:
        references/checklist.md:
          gap_class: "repo-resolvable-fact"
          route_affecting_surfaces: []
          conflicts_with: []
          decision_problem: "checklist"
          sequenced_after: []
          must_co_trigger_with: []
        references/diagnosis-only.md:
          gap_class: "repo-resolvable-fact"
          route_affecting_surfaces: []
          conflicts_with: []
          decision_problem: "diagnosis-only"
          sequenced_after: []
          must_co_trigger_with: []
        references/evidence-patterns.md:
          gap_class: "repo-resolvable-fact"
          route_affecting_surfaces: []
          conflicts_with: []
          decision_problem: "evidence-patterns"
          sequenced_after: []
          must_co_trigger_with: []
        references/implementation-preparation.md:
          gap_class: "repo-resolvable-fact"
          route_affecting_surfaces: []
          conflicts_with: []
          decision_problem: "implementation-preparation"
          sequenced_after: []
          must_co_trigger_with: []
        references/solution-optimality.md:
          gap_class: "route-or-material-unknown"
          route_affecting_surfaces: ["acceptance", "scope", "material-risk-floor"]
          conflicts_with: []
          decision_problem: "solution-optimality"
          sequenced_after: []
          must_co_trigger_with: []
        references/source-backed-answer.md:
          gap_class: "repo-resolvable-fact"
          route_affecting_surfaces: []
          conflicts_with: []
          decision_problem: "source-backed-answer"
          sequenced_after: []
          must_co_trigger_with: []
    layer3_candidates: ["repository-context-map", "consumer-impact-analysis", "data-side-effect-flow-tracing", "failure-diagnosis", "release-rollback", "api-contract-design", "version-compatibility", "data-migration-design", "transaction-consistency", "concurrency-control", "failure-contract-design", "test-strategy", "permission-boundary-modeling", "threat-modeling", "web-security", "degradation-circuit-breaking", "observability", "idempotency-retry-design", "package-dependency-management", "minimal-correct-implementation", "refactoring", "web3-product-extension", "ai-product-extension", "bigdata-product-extension", "iot-embedded-extension", "payment-trading-extension", "low-level-systems-extension", "android-platform-extension", "cloud-platform-extension", "cross-platform-client-extension", "ios-ipados-platform-extension", "linux-desktop-platform-extension", "macos-platform-extension", "windows-platform-extension", "repository-impact-inspection", "configuration-runtime-policy", "dependency-vulnerability-scanning"]
    task_routable: true
  - name: acceptance-criteria-builder
    routing_mode: evidence-only
    required_expertise_tags: ["foundation-intake-requirements", "foundation-quality-testing"]
    path: "src/professional-skills/acceptance-criteria-builder"
    role_support: ["analysis-agent"]
    trigger_signals: ["acceptance is vague", "failure behavior unspecified"]
    anti_trigger_signals: ["acceptance already measurable", "question only"]
    required_inputs: ["intent slice", "source evidence", "known constraints"]
    output_contract: ["measurable acceptance", "non-goals", "proof expectations"]
    escalation_signals: ["scope, authority, or material risk exceeds the selected task contract"]
    reference_index:
      - path: "references/checklist.md"
        type: decision-checklist
        load_when: "A bounded L2 draft or review needs a compact coverage check for actor, precondition, action, result, normal, invalid, boundary, permission, regression, compatibility, and evidence"
        do_not_load_when: "The body quality gate is enough or evidence mapping/sign-off freshness is material"
        required_by: ["analysis-agent"]
        required_output: ["checklist-result", "residual-risk"]
      - path: "references/evidence-patterns.md"
        type: evidence-pattern
        load_when: "Closure depends on criteria-to-validation mapping, stakeholder sign-off freshness, manual/audit evidence limits, or accepted residual risk"
        do_not_load_when: "No criterion needs proof beyond the body evidence contract and quality gate"
        required_by: ["analysis-agent"]
        required_output: ["evidence-record", "proof-limit", "residual-risk"]
      - path: "references/index.md"
        type: index
        load_when: "competing acceptance criteria builder references require dependency, conflict, or output-fragment selection"
        do_not_load_when: "the acceptance criteria builder root or a task-named reference already resolves selection"
        required_by: ["analysis-agent"]
        required_output: ["reference-selection"]
    layer3_candidates: ["acceptance-standard-definition", "scenario-decomposition", "test-strategy"]
    task_routable: true
  - name: task-dag-planner
    routing_mode: evidence-only
    required_expertise_tags: ["foundation-architecture-design", "foundation-delivery-platform", "foundation-engineering-workflow", "foundation-reliability-operations"]
    path: "src/professional-skills/task-dag-planner"
    role_support: ["analysis-agent"]
    trigger_signals: ["explicit Task DAG request with accepted Engineering Brief", "accepted Brief has multiple tasks with a dependency parallel benefit integration need or release order"]
    anti_trigger_signals: ["single bounded edit", "task DAG already accepted", "unanalysed change request"]
    required_inputs: ["accepted Engineering Brief", "source evidence", "semantic and Primary Professional Skill boundaries", "resource and minimum sufficient Review Boundaries"]
    output_contract: ["Task Capsules with one Primary Professional Skill each", "dependency edges", "integration order", "minimum sufficient Review Boundaries preserving required Review Skills and Specialist obligations"]
    escalation_signals: ["scope, authority, or material risk exceeds the selected task contract"]
    reference_index:
      - path: "references/checklist.md"
        type: decision-checklist
        load_when: "A bounded review needs a quick DAG readiness and closure checklist"
        do_not_load_when: "Detailed evidence map or executable node contract is required"
        required_by: ["analysis-agent"]
        required_output: ["checklist-result", "residual-risk"]
      - path: "references/index.md"
        type: index
        load_when: "competing task dag planner references require dependency, conflict, or output-fragment selection"
        do_not_load_when: "the task dag planner root or a task-named reference already resolves selection"
        required_by: ["analysis-agent"]
        required_output: ["reference-selection"]
      - path: "references/planning-evidence-patterns.md"
        type: evidence-pattern
        load_when: "Closing graph validity, new-hypothesis, parallelization, rollback, or plan-execution consistency"
        do_not_load_when: "Only task field shape is needed"
        required_by: ["analysis-agent"]
        required_output: ["evidence-record", "proof-limit", "residual-risk"]
      - path: "references/task-contract-patterns.md"
        type: benchmark-pattern
        load_when: "Nodes must be executable by a fresh agent or placeholder tasks need replacement"
        do_not_load_when: "L1/L2 handoff already has exact files, command, and residual risk"
        required_by: ["analysis-agent"]
        required_output: ["option-comparison", "selected-approach"]
    layer3_candidates: ["task-dag-decomposition", "release-rollback"]
    task_routable: true
  - name: high-risk-design-review
    routing_mode: evidence-only
    required_expertise_tags: ["foundation-architecture-design", "foundation-delivery-platform", "foundation-reliability-operations", "foundation-technology-selection"]
    path: "src/professional-skills/high-risk-design-review"
    role_support: ["review-agent"]
    trigger_signals: ["critical path requires deeper design evidence", "major architecture boundary"]
    anti_trigger_signals: ["ordinary fast path", "ordinary standard path"]
    required_inputs: ["Engineering Brief", "acceptance", "bounded design evidence"]
    output_contract: ["design findings", "reviewed scope", "residual risk"]
    escalation_signals: ["scope, authority, or material risk exceeds the selected task contract"]
    reference_index:
      - path: "references/design-review-checklist.md"
        type: decision-checklist
        load_when: "critical-path design changes need boundary, alternative, and reversibility review"
        do_not_load_when: "no material architecture boundary or high-risk design decision changed"
        required_by: ["review-agent"]
        required_output: ["checklist-result", "residual-risk"]
    layer3_candidates: ["release-rollback", "algorithm-data-structure-selection", "language-runtime-selection", "package-dependency-management", "solution-optimality-evaluation", "technology-stack-selection", "module-boundary-design"]
    task_routable: true
  - name: engineering-artifact-review
    routing_mode: evidence-only
    required_expertise_tags: ["foundation-architecture-design", "foundation-engineering-workflow", "foundation-repository-intelligence"]
    path: "src/professional-skills/engineering-artifact-review"
    role_support: ["review-agent"]
    trigger_signals: ["ordinary Engineering Brief Task Plan acceptance or contract artifact needs independent review", "pre-implementation decision affects downstream tasks"]
    anti_trigger_signals: ["actual implementation diff review", "ordinary Direct Task", "high-risk Engineering Brief; use `high-risk-design-review`", "release deployment or migration readiness; use `delivery-release-gate`"]
    required_inputs: ["acceptance", "decision boundary", "actual engineering artifact", "source evidence"]
    output_contract: ["verdict and severity-ranked findings", "reviewed, unreviewed, and unverified scope", "owner, dependency, first-slice, validation, and rollback assessment", "downstream impact and residual risk"]
    escalation_signals: ["scope, authority, or material risk exceeds the selected task contract"]
    reference_index:
      - path: "references/review-checklist.md"
        type: decision-checklist
        load_when: "ordinary pre-implementation artifact decisions have downstream impact"
        do_not_load_when: "the task is implementation diff review, a Direct Task, high-risk design, or release/deployment/migration readiness"
        required_by: ["review-agent"]
        required_output: ["checklist-result", "residual-risk"]
    layer3_candidates: ["code-review"]
    task_routable: true
  - name: experience-impact-modeler
    routing_mode: evidence-only
    required_expertise_tags: ["foundation-experience-design", "foundation-quality-testing", "foundation-security-privacy"]
    path: "src/professional-skills/experience-impact-modeler"
    role_support: ["analysis-agent"]
    trigger_signals: ["user flow change", "interaction state change"]
    anti_trigger_signals: ["backend only with no experience impact", "question only"]
    required_inputs: ["intent slice", "existing flow evidence", "read scope"]
    output_contract: ["flow evidence", "affected states", "experience constraints"]
    escalation_signals: ["scope, authority, or material risk exceeds the selected task contract"]
    reference_index:
      - path: "references/checklist.md"
        type: decision-checklist
        load_when: "A bounded review needs actor, entry, state, accessibility, analytics, and verification inventory"
        do_not_load_when: "Full flow evidence, accessibility gates, or experiment proof decides closure"
        required_by: ["analysis-agent"]
        required_output: ["checklist-result", "residual-risk"]
      - path: "references/experience-output-and-gates.md"
        type: targeted
        load_when: "Closure depends on flow evidence, accessibility/recovery gates, analytics coupling, state-to-validation maps, or handoff fields"
        do_not_load_when: "The body output contract is enough and evidence is not being closed"
        required_by: ["analysis-agent"]
        required_output: ["gate-decision", "residual-risk"]
      - path: "references/index.md"
        type: index
        load_when: "competing experience impact modeler references require dependency, conflict, or output-fragment selection"
        do_not_load_when: "the experience impact modeler root or a task-named reference already resolves selection"
        required_by: ["analysis-agent"]
        required_output: ["reference-selection"]
      - path: "references/journey-risk-patterns.md"
        type: benchmark-pattern
        load_when: "Journey risks involve destructive/sensitive flows, high-volume operational work, experiment instrumentation, stale prior-evidence claims, or proof limits"
        do_not_load_when: "A local component UX check has no journey, analytics, or sensitive-flow risk"
        required_by: ["analysis-agent"]
        required_output: ["option-comparison", "selected-approach"]
    layer3_candidates: ["user-flow-modeling", "interaction-state-modeling", "design-system-rules", "information-architecture", "prototype-description"]
    task_routable: true
  - name: domain-impact-modeler
    routing_mode: evidence-only
    required_expertise_tags: ["foundation-data-middleware", "foundation-domain-engineering", "foundation-domain-modeling", "specialty-concurrency-coordination", "specialty-messaging-event-delivery", "specialty-transaction-consistency"]
    path: "src/professional-skills/domain-impact-modeler"
    role_support: ["analysis-agent"]
    trigger_signals: ["business invariant change", "domain ownership unclear"]
    anti_trigger_signals: ["presentation only with no domain behavior", "question only"]
    required_inputs: ["intent slice", "domain source evidence", "owning module candidates"]
    output_contract: ["owning module", "domain invariants", "rejected locations"]
    escalation_signals: ["scope, authority, or material risk exceeds the selected task contract"]
    reference_index:
      - path: "references/business-invariant-evidence.md"
        type: evidence-pattern
        load_when: "Business vocabulary, state transitions, calculations, or forbidden outcomes need explicit invariant proof"
        do_not_load_when: "No domain invariant changes"
        required_by: ["analysis-agent"]
        required_output: ["evidence-record", "proof-limit", "residual-risk"]
      - path: "references/checklist.md"
        type: decision-checklist
        load_when: "Aggregate, rule, event, permission, transition, audit, or consistency surfaces need a compact coverage check"
        do_not_load_when: "The current source and tests already establish every relevant surface"
        required_by: ["analysis-agent"]
        required_output: ["checklist-result", "residual-risk"]
      - path: "references/evidence-patterns.md"
        type: evidence-pattern
        load_when: "A domain rule needs source-to-test, event-consumer, owner, freshness, or residual-risk evidence"
        do_not_load_when: "The root output contract is sufficient for the bounded decision"
        required_by: ["analysis-agent"]
        required_output: ["evidence-record", "proof-limit", "residual-risk"]
      - path: "references/index.md"
        type: index
        load_when: "competing domain impact modeler references require dependency, conflict, or output-fragment selection"
        do_not_load_when: "the domain impact modeler root or a task-named reference already resolves selection"
        required_by: ["analysis-agent"]
        required_output: ["reference-selection"]
    layer3_candidates: ["domain-object-identification", "business-rule-extraction", "state-machine-modeling", "transaction-consistency", "concurrency-control", "business-invariant-analysis", "domain-event-modeling", "use-case-modeling", "windows-platform-extension"]
    task_routable: true
  - name: architecture-impact-reviewer
    routing_mode: evidence-only
    required_expertise_tags: ["foundation-architecture-design", "foundation-repository-intelligence"]
    path: "src/professional-skills/architecture-impact-reviewer"
    role_support: ["analysis-agent", "review-agent"]
    trigger_signals: ["module boundary change", "dependency direction risk", "owner-internal implementation structure reuse or deliberate separation remains unresolved"]
    anti_trigger_signals: ["isolated owner internal edit after placement is fixed", "no structural impact"]
    required_inputs: ["desired behavior", "module and dependency boundary"]
    required_inputs_by_role:
      analysis-agent: ["candidate ownership", "dependency", "consumer", "reuse evidence"]
      review-agent: ["bounded architecture artifact", "placement criteria and supporting evidence"]
    output_contract: ["placement decision", "architecture verdict", "structural risk"]
    output_contract_by_role:
      analysis-agent: ["placement decision", "rejected alternatives", "dependency and consumer impact"]
      review-agent: ["architecture verdict", "boundary findings", "unreviewed structural risk"]
    escalation_signals: ["scope, authority, or material risk exceeds the selected task contract"]
    reference_index:
      - path: "references/placement-and-ownership.md"
        type: targeted
        load_when: "Structure responsibility ownership reuse or placement remains open"
        do_not_load_when: "Owner public/private surface and smallest viable placement are fixed by current evidence"
        required_by: ["analysis-agent", "review-agent"]
        required_output: ["boundary-decision", "selected-approach", "residual-risk"]
      - path: "references/consumer-and-data-impact.md"
        type: targeted
        load_when: "Public or indirect consumer or authoritative-data impact remains open"
        do_not_load_when: "No consumer contract compatibility versioning migration or data-owner boundary changes"
        required_by: ["analysis-agent", "review-agent"]
        required_output: ["boundary-decision", "validation-plan", "residual-risk"]
      - path: "references/dependency-topology-and-enforcement.md"
        type: targeted
        load_when: "Dependency direction topology or durable enforcement remains open"
        do_not_load_when: "Current source edges topology owner and enforcement evidence already fix the boundary"
        required_by: ["analysis-agent", "review-agent"]
        required_output: ["boundary-decision", "gate-decision", "validation-plan", "residual-risk"]
      - path: "references/reversibility-evolution-and-proof-limits.md"
        type: targeted
        load_when: "Reversal coexistence migration evolution or architecture proof limits remain open"
        do_not_load_when: "Current evidence fixes reversibility evolution residual risk and next owner"
        required_by: ["analysis-agent", "review-agent"]
        required_output: ["decision-record", "validation-plan", "proof-limit", "residual-risk"]
      - path: "references/checklist.md"
        type: decision-checklist
        load_when: "A bounded L2 mode needs compact checks for its triggered placement, ownership, dependency, consumer, data, topology, or reversibility risk"
        do_not_load_when: "The root contract is enough or targeted proof fields are required"
        required_by: ["analysis-agent", "review-agent"]
        required_output: ["checklist-result", "residual-risk"]
      - path: "references/index.md"
        type: index
        load_when: "competing architecture impact reviewer references require dependency, conflict, or output-fragment selection"
        do_not_load_when: "the architecture impact reviewer root or a task-named reference already resolves selection"
        required_by: ["analysis-agent", "review-agent"]
        required_output: ["reference-selection"]
      - path: "references/solution-optimality.md"
        type: targeted
        load_when: "An architecture boundary, ownership, dependency, topology, or operational-responsibility decision has a material alternative"
        do_not_load_when: "The change is owner-internal with no structural impact or current evidence already fixes placement"
        required_by: ["analysis-agent", "review-agent"]
        required_output: ["selected-approach", "residual-risk"]
    context_admissibility:
      contract: "changeforge.reference-context-admissibility/v3"
      references:
        references/placement-and-ownership.md:
          gap_class: "route-or-material-unknown"
          route_affecting_surfaces: ["acceptance", "scope", "material-risk-floor"]
          conflicts_with: []
          decision_problem: "placement-and-ownership"
          sequenced_after: []
          must_co_trigger_with: []
        references/consumer-and-data-impact.md:
          gap_class: "route-or-material-unknown"
          route_affecting_surfaces: ["acceptance", "scope", "material-risk-floor"]
          conflicts_with: []
