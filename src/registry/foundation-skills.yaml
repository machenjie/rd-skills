foundation_skills:
  - name: requirement-clarification
    required_expertise_tags: ["foundation-intake-requirements"]
    path: "src/foundation/capabilities/requirement-clarification"
    content_class: compact
    role_support: ["analysis-agent"]
    trigger_signals: ["clarify ambiguous goals constraints assumptions missing information"]
    anti_trigger_signals: ["no task-local requirement clarification decision is required"]
    required_inputs: ["current task contract", "selected primary Professional Skill", "task-local trigger evidence"]
    output_contract: ["clarification decision with material ambiguity, inspected evidence, blocking classification, bounded assumptions or options, proceed and wait boundary, owner questions, reopen signals, and downstream updates"]
    escalation_signals: ["Unclear intent can invalidate all downstream design and implementation"]
    reference_index:
      - path: "references/benchmarks-and-patterns.md"
        type: benchmark-pattern
        load_when: "unknown authority reversibility or partial progress leaves options viable"
        do_not_load_when: "one verified owner decision resolves every material ambiguity"
        required_by: ["analysis-agent"]
        required_output: ["option-comparison", "selected-approach"]
      - path: "references/checklist.md"
        type: decision-checklist
        load_when: "request contains blocking unknowns assumptions conflicts or unsafe defaults"
        do_not_load_when: "current facts and authority establish all behavior-changing decisions"
        required_by: ["analysis-agent"]
        required_output: ["checklist-result", "residual-risk"]
      - path: "references/evidence-patterns.md"
        type: evidence-pattern
        load_when: "stakeholder source freshness or prior-decision claims need verification"
        do_not_load_when: "current source and owner records prove each clarification fact"
        required_by: ["analysis-agent"]
        required_output: ["evidence-record", "proof-limit", "residual-risk"]
    used_by: ["change-intake-compiler"]
    group: "intake-requirements"
    delivery_scope: product
  - name: requirement-structuring
    required_expertise_tags: ["foundation-intake-requirements"]
    path: "src/foundation/capabilities/requirement-structuring"
    content_class: compact
    role_support: ["analysis-agent"]
    trigger_signals: ["structure raw request into scope constraints dependencies and deliverables"]
    anti_trigger_signals: ["no task-local requirement structuring decision is required"]
    activation:
      contract: foundation-activation/v1
      id: foundation-activation-requirement-structuring
      mode: explicit-analyzed
      path: analyzed
      profile: analysis-agent
      primary_skill: change-intake-compiler
      review_skill: ai-code-review-refactor
      semantic_atoms: [unstructured-request-input, scope-constraints-dependencies-deliverables-open]
      matcher_evidence: [analysis-action, raw-requirement, requirement-structure-open]
      negative_families: [lexical-near-miss, explicit-anti-or-adjacent, alternate-professional-owner, analysis-authority-invalid]
    required_inputs: ["current task contract", "selected primary Professional Skill", "task-local trigger evidence"]
    output_contract: ["structured requirement with sourced current behavior, desired outcomes, actors, scope and exclusions, constraints and assumptions, dependencies, risks, deliverables, acceptance trace, unresolved decisions, and owners"]
    escalation_signals: ["Unstructured requests hide conflicts and unstated acceptance gaps"]
    reference_index:
      - path: "references/benchmarks-and-patterns.md"
        type: benchmark-pattern
        load_when: "current desired scope constraint or dependency framing remains ambiguous"
        do_not_load_when: "accepted behavior-first structured requirement already fixes every requirement boundary"
        required_by: ["analysis-agent"]
        required_output: ["option-comparison", "decision-record"]
      - path: "references/checklist.md"
        type: decision-checklist
        load_when: "structured requirement lacks observable behavior actors non-goals constraints or acceptance"
        do_not_load_when: "accepted structured requirement contains every required task-local field"
        required_by: ["analysis-agent"]
        required_output: ["checklist-result", "residual-risk"]
      - path: "references/evidence-patterns.md"
        type: evidence-pattern
        load_when: "current-behavior constraint dependency or non-goal claims need proof"
        do_not_load_when: "fresh source and owner evidence substantiate every structured requirement fact"
        required_by: ["analysis-agent"]
        required_output: ["evidence-record", "proof-limit", "residual-risk"]
    used_by: ["change-intake-compiler"]
    group: "intake-requirements"
    delivery_scope: product
