    activation:
      contract: foundation-activation/v1
      id: foundation-activation-test-strategy
      mode: explicit-analyzed
      path: analyzed
      profile: analysis-agent
      primary_skill: quality-test-gate
      review_skill: quality-test-gate
      semantic_atoms: [multiple-material-failure-mechanisms, test-level-oracle-omission-selection, single-fixed-command-absent]
      matcher_evidence: [analysis-action, proof-portfolio-open, failure-oracle-mapping]
      negative_families: [lexical-near-miss, explicit-anti-or-adjacent, alternate-professional-owner, analysis-authority-invalid]
      runtime_matcher:
        contract: foundation-semantic-matcher/v1
        rollout: enabled
        action: analysis-only
        combine: all
        predicates:
          - atom: multiple-material-failure-mechanisms
            operator: all-term-groups
            scope: bounded-clause
            polarity: present
            action: none
            term_groups:
              - [several, multiple]
              - [material]
              - [failure, failures]
              - [mechanism, mechanisms]
          - atom: test-level-oracle-omission-selection
            operator: all-term-groups
            scope: bounded-clause
            polarity: present
            action: selection
            term_groups:
              - [test level, test levels]
              - [observable failure oracle, observable failure oracles]
              - [omission, omissions]
          - atom: single-fixed-command-absent
            operator: all-term-groups
            scope: bounded-clause
            polarity: absent
            action: none
            term_groups:
              - [single command]
    required_inputs: ["current task contract", "selected primary Professional Skill", "task-local trigger evidence"]
